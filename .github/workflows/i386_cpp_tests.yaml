name: i386 Tests
description: Verify the library works on i386 compilation/execution target
on:
  pull_request:
  push:
    branches: main
jobs:
  build-i386:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: 386
          
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
          
      - name: Build i386 test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/workflows/scripts/Dockerfile.32-bit
          platforms: linux/386
          tags: 32-bit-tests:i386
          load: true
          cache-from: type=gha,scope=32-bit-tests
          cache-to: type=gha,mode=max,scope=32-bit-tests

      - name: Build and test
        run: ${GITHUB_WORKSPACE}/.github/workflows/scripts/test_32bit.sh
